name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: staynest
          POSTGRES_PASSWORD: staynest
          POSTGRES_DB: staynest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staynest -d staynest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STAYNEST_TEST_DATABASE_URL: postgres://staynest:staynest@localhost:5432/staynest_test?sslmode=disable

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply database migrations
        run: |
          for migration in migrations/*.up.sql; do
            echo "Applying $migration"
            psql "$STAYNEST_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./... -count=1

      - name: Build all packages
        run: go build ./...
